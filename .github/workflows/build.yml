name: xeno-store

# XENO STORE pipeline (docs/SPEC.md §13):
#
#   web-and-catalog  Node 22 + Python 3.12: bundle the UI, build + validate the
#                    offline catalog, run the catalog unit tests, upload both.
#   host-tests       gcc + OpenSSL: `make test` (host binary + tests/host/run.sh).
#   ps5-elf          LLVM 18 + ps5-payload-dev SDK v0.40 (same recipe as
#                    release.yml): `make ps5 pkg` → xeno-store.elf,
#                    xeno-store-browser.elf, dist/XENO-STORE.zip.
#   release          main only: create/update the GitHub release
#                    v<VERSION> with both ELFs, the homebrew zip,
#                    SHA256SUMS and the catalog; then patch
#                    updates/payloads.json (url/version/sha256) and commit it
#                    back with [skip ci].
#
# Every push to any branch runs the first three jobs,
# so a pull request shows green before it is merged.

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: xeno-store-${{ github.ref }}
  cancel-in-progress: true

env:
  PS5_SDK_TAG: v0.40

jobs:
  web-and-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build web UI
        run: make web

      - name: Build + validate the offline catalog
        run: make catalog

      - name: Catalog pipeline unit tests
        run: python3 -I -m unittest discover -s tools/catalog/tests -v

      - name: Validate the published feeds
        run: |
          set -euo pipefail
          for f in updates/*.json homebrew/homebrew.json homebrew/sce_sys/param.json catalog/sources.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1])); print('ok', sys.argv[1])" "$f"
          done
          python3 - <<'PY'
          import json
          cat = json.load(open('catalog/xeno-catalog.json'))
          ids = {g['id'] for g in cat['games']}
          feat = json.load(open('updates/featured.json'))
          missing = [i for i in feat.get('hero', []) if i not in ids]
          for row in feat.get('rows', []):
              missing += [i for i in row.get('ids', []) if i not in ids]
          if missing:
              raise SystemExit('featured.json references unknown game ids: %s' % missing)
          print('featured.json: every game id exists in the catalog')
          PY

      - name: Upload web + catalog
        uses: actions/upload-artifact@v4
        with:
          name: web-and-catalog
          path: |
            web/dist/index.html
            catalog/xeno-catalog.json
            catalog/revision.json
            catalog/report.json
          if-no-files-found: error

  host-tests:
    needs: [web-and-catalog]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps (gcc, OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Restore web + catalog
        uses: actions/download-artifact@v4
        with:
          name: web-and-catalog
          path: .

      - name: Host build + tests
        run: |
          set -euo pipefail
          test -s web/dist/index.html
          test -s catalog/xeno-catalog.json
          pkg-config --exists openssl && echo "OpenSSL $(pkg-config --modversion openssl) found"
          make test

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-logs
          path: /tmp/xeno-tests.*/*.log
          if-no-files-found: ignore

  ps5-elf:
    needs: [host-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 40   # includes a cold cargo build of fpkg_build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install payload toolchain (pinned LLVM 18)
        run: |
          # The SDK's prospero-clang/prospero-lld wrappers resolve a host LLVM
          # via prospero-llvm-config (searches PATH for llvm-config-NN). Pin
          # LLVM 18 to match the SDK contract and release.yml.
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 llvm-18-dev unzip file
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Download PS5 Payload SDK
        run: |
          curl --retry 3 --retry-delay 5 --retry-connrefused \
            --fail --location --silent --show-error \
            -o /tmp/ps5-payload-sdk.zip \
            "https://github.com/ps5-payload-dev/sdk/releases/download/${PS5_SDK_TAG}/ps5-payload-sdk.zip"
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt

      - name: Smoke-check the prospero toolchain
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          # Fail fast with a clear message if the wrapper cannot resolve LLVM,
          # instead of a confusing mid-compile error inside `make ps5`.
          "$PS5_PAYLOAD_SDK/bin/prospero-clang" --version

      - name: Restore web + catalog
        uses: actions/download-artifact@v4
        with:
          name: web-and-catalog
          path: .

      - name: Cross-compile the payloads + homebrew package
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          set -euo pipefail
          test -s web/dist/index.html
          test -s catalog/xeno-catalog.json
          make assets
          make ps5 pkg

      - name: Build the .pkg builder (fpkg_build)
        run: |
          set -euo pipefail
          # ps5upload's fpkg_build (GPL-3.0) lays out and verifies the debug
          # package; pinned to a known-good commit.
          mkdir -p ps5upload && cd ps5upload
          git init -q
          git fetch -q --depth 1 https://github.com/phantomptr/ps5upload 01afdf8926ede277b8369b0f1976f44825d0de36
          git checkout -q FETCH_HEAD
          rustup toolchain install stable --profile minimal
          cd engine
          cargo build --release -p ps5upload-fpkg --example fpkg_build
          test -x target/release/examples/fpkg_build

      - name: Build the Games-row app (PPSA99500.ffpkg + XENO-STORE.pkg)
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          set -euo pipefail
          sudo apt-get install -y -q makefs >/dev/null
          make eboot
          XENO_FPKG_BUILD="$PWD/ps5upload/engine/target/release/examples/fpkg_build" make ffpkg
          test -s dist/XENO-STORE.pkg
          test -s dist/PPSA99500.ffpkg
          python3 tools/ufs2_check.py dist/PPSA99500.ffpkg
          ls -la app/dist/eboot.bin dist/XENO-STORE.pkg dist/PPSA99500.ffpkg

      - name: Verify artifacts
        run: |
          set -euo pipefail
          test -s xeno-store.elf
          test -s xeno-store-browser.elf
          test -s dist/XENO-STORE.zip
          file xeno-store.elf xeno-store-browser.elf
          unzip -l dist/XENO-STORE.zip
          # The embedded catalog must be the one this run built, not a placeholder.
          grep -q 'XENO_ASSETS_PLACEHOLDER_CATALOG 0' src/assets.h
          grep -q 'XENO_ASSETS_PLACEHOLDER_UI 0' src/assets.h
          ls -la xeno-store.elf xeno-store-browser.elf dist/XENO-STORE.zip

      - name: Upload payloads
        uses: actions/upload-artifact@v4
        with:
          name: ps5-elf
          path: |
            xeno-store.elf
            xeno-store-browser.elf
            dist/XENO-STORE.zip
            dist/XENO-STORE.pkg
            dist/PPSA99500.ffpkg
          if-no-files-found: error

  desktop:
    # XENO STORE Desktop: one Go binary per OS (standard library only), cross-compiled here.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Vet + smoke test
        working-directory: desktop
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          CGO_ENABLED=0 go build -o /tmp/xsd .
          HOME="$(mktemp -d)" /tmp/xsd > /tmp/xsd.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9096/__desktop/ -o /tmp/shell.html && break; sleep 0.3; done
          grep -q 'Link to your PS5' /tmp/shell.html
          curl -fsS http://127.0.0.1:9096/__desktop/api/state | grep -q '"ok":true'
          kill $pid
      - name: Build for Windows, macOS and Linux
        working-directory: desktop
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < ../VERSION)"
          mkdir -p ../dist/desktop
          build() {  # goos goarch label
            out="$(mktemp -d)"
            exe="XENO-STORE-Desktop"; [ "$1" = windows ] && exe="$exe.exe"
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$out/$exe" .
            cp ../LICENSE "$out/LICENSE.txt"
            name="XENO-STORE-Desktop-$VERSION-$3"
            if [ "$1" = linux ]; then tar -C "$out" -czf "../dist/desktop/$name.tar.gz" .; else (cd "$out" && zip -q -9 "$OLDPWD/../dist/desktop/$name.zip" ./*); fi
          }
          build windows amd64 win-x64
          build windows arm64 win-arm64
          build darwin  arm64 mac-arm64
          build darwin  amd64 mac-x64
          build linux   amd64 linux-x64
          build linux   arm64 linux-arm64
          ls -la ../dist/desktop
      - name: Upload desktop builds
        uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/desktop/*
          if-no-files-found: error

  release:
    needs: [ps5-elf, desktop]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The payloads.json patch is committed back, so a full ref is needed.
          fetch-depth: 0

      - name: Resolve version and tag
        id: ver
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=v$VERSION"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets + SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          NAMES="PPSA99500.ffpkg XENO-STORE.pkg xeno-store.elf xeno-store-browser.elf XENO-STORE.zip xeno-catalog.json"
          for name in $NAMES; do
            f="$(find artifacts -type f -name "$name" -print -quit)"
            if [ -z "$f" ]; then echo "::error::$name missing from artifacts"; exit 1; fi
            cp -v "$f" "release/$name"
          done
          # Desktop app archives (built per OS by the desktop job), when present.
          find artifacts -type f -name 'XENO-STORE-Desktop-*' -exec cp -v {} release/ \;
          cd release
          # one <file>.sha256 per PS5 file, plus SHA256SUMS over everything
          for name in PPSA99500.ffpkg XENO-STORE.pkg xeno-store.elf xeno-store-browser.elf XENO-STORE.zip; do
            sha256sum "$name" > "$name.sha256"
          done
          sha256sum $(ls | grep -v '\.sha256$' | grep -v '^SHA256SUMS$' | grep -v '^BUILD-INFO.json$') > SHA256SUMS
          python3 - "$GITHUB_SHA" <<'PY'
          import json, os, sys, time
          files = {n: os.path.getsize(n) for n in sorted(os.listdir(".")) if not n.endswith(".sha256") and n != "SHA256SUMS"}
          ver = open("../VERSION").read().strip()
          json.dump({"name": "XENO STORE", "version": ver, "commit": sys.argv[1], "builtAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                     "titleId": "PPSA99500", "files": files}, open("BUILD-INFO.json", "w"), indent=2)
          PY
          cat SHA256SUMS BUILD-INFO.json

      - name: Write release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          REV="$(python3 -c "import json; print(json.load(open('catalog/revision.json'))['revision'])")"
          GAMES="$(python3 -c "import json; print(json.load(open('catalog/revision.json'))['games'])")"
          {
            printf 'XENO STORE %s — PS5 game store + download manager by XENOKING.\n\n' "$VERSION"
            printf '## Files\n'
            printf -- '- **PPSA99500.ffpkg** — the Games-row app (XENO icon). Copy it to `/data/homebrew/` on the PS5; ShadowMountPlus mounts it and it appears under **Games**. Needs kstuff + ShadowMountPlus.\n'
            printf -- '- **XENO-STORE.pkg** — the same app as a fake package, for consoles that install FPKGs.\n'
            printf -- '- **xeno-store.elf** — the store (server only). Send it with any ELF loader (XENO TOOL → Payloads, port 9021) and open `http://<ps5-ip>:9095` or `http://xeno.local:9095`.\n'
            printf -- '- **xeno-store-browser.elf** — the same store, and it opens the PS5 browser to it.\n'
            printf -- '- **XENO-STORE.zip** — home-screen app for etaHEN / itemzflow: extract into `/data/homebrew/`.\n'
            printf -- '- **xeno-catalog.json** — catalog revision %s (%s games), the same data embedded in the ELF.\n' "$REV" "$GAMES"
            printf -- '- **XENO-STORE-Desktop** — the PC app for Windows, macOS and Linux: link to your PS5 with the code it shows, browse and send downloads to the PS5, and send files from your PC.\n'
            printf -- '- **SHA256SUMS** and one **.sha256** per PS5 file — verify what you downloaded; the in-app updater checks the same hashes. **BUILD-INFO.json** names the commit and sizes.\n'
            printf '\n## Payload Manager\n'
            printf 'Add `https://raw.githubusercontent.com/XENOKING123/XENO-STORE/main/updates/payloads.json` as a source and enable auto-start.\n'
            printf '\n## Docs\n'
            printf -- '- [README](https://github.com/XENOKING123/XENO-STORE#readme) · [User guide](https://github.com/XENOKING123/XENO-STORE/blob/main/docs/GUIDE.md) · [Changelog](https://github.com/XENOKING123/XENO-STORE/blob/main/docs/CHANGELOG.md)\n'
            printf '\n```\n'
            cat release/SHA256SUMS
            printf '```\n'
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "XENO STORE $VERSION" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" --title "XENO STORE $VERSION" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$TAG" release/* --clobber
          echo "Uploaded $(find release -type f | wc -l) assets to $TAG"

      - name: Patch updates/payloads.json (url, version, sha256)
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          tag, version = os.environ["TAG"], os.environ["VERSION"]
          sums = {}
          for line in open("release/SHA256SUMS", encoding="utf-8"):
              digest, name = line.split()
              sums[name.lstrip("*")] = digest
          path = "updates/payloads.json"
          doc = json.load(open(path, encoding="utf-8"))
          for p in doc["payloads"]:
              fn = p["filename"]
              if fn not in sums:
                  raise SystemExit("no checksum for %s" % fn)
              p["version"] = version
              p["url"] = "https://github.com/XENOKING123/XENO-STORE/releases/download/%s/%s" % (tag, fn)
              p["sha256"] = sums[fn]
          doc["minimumVersion"] = doc.get("minimumVersion") or version
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(doc, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          print(open(path, encoding="utf-8").read())
          PY

      - name: Commit payloads.json back
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xeno-store-ci"
          git config user.email "xeno-store-ci@users.noreply.github.com"
          if git diff --quiet -- updates/payloads.json; then
            echo "payloads.json unchanged — nothing to commit"
            exit 0
          fi
          git add updates/payloads.json
          git commit -m "xeno-store: publish ${{ steps.ver.outputs.tag }} hashes in payloads.json [skip ci]"
          # Another job (catalog sync) may have pushed in the meantime.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            echo "push attempt $attempt failed — retrying"
            sleep 5
          done
          echo "::error::could not push payloads.json"
          exit 1

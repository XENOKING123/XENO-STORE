name: xeno-store-catalog-sync

# Keeps catalog/ fresh without a code change (SPEC §13, §17.12):
# every 2 hours (and on demand) the live sources are scraped, every release
# link is audited, the result is validated and committed only when something
# actually changed, together with the dlpsgame snapshot
# (catalog/snapshots/xeno-dlpsgame) so new PS5 posts land within ~2 hours and
# the offline build keeps up. The console refreshes its catalog from the
# committed revision.json / xeno-catalog.json, and build.yml ships that same
# committed file in the next release (ELF + xeno-catalog.json asset).

on:
  schedule:
    # Minute 17, not :00, to stay clear of the top-of-hour scheduler rush.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      audit_budget_seconds:
        description: 'Seconds the link audit may run (0 = skip the audit)'
        required: false
        default: '1500'
      enrich_budget_seconds:
        description: 'Seconds for the Steam / PS Store enrichment passes'
        required: false
        default: '240'

permissions:
  contents: write

# Runs never overlap: a run still going when the next one fires keeps it
# queued (never cancelled mid-commit), and GitHub keeps at most one queued run.
concurrency:
  group: xeno-store-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the catalog from the live sources
        env:
          ENRICH_BUDGET: ${{ github.event.inputs.enrich_budget_seconds || '240' }}
        run: |
          set -euo pipefail
          python3 tools/catalog/build_catalog.py --online --enrich-budget "$ENRICH_BUDGET"

      - name: Audit release links
        env:
          AUDIT_BUDGET: ${{ github.event.inputs.audit_budget_seconds || '1500' }}
        run: |
          set -euo pipefail
          if [ "$AUDIT_BUDGET" = "0" ]; then echo "audit skipped by request"; exit 0; fi
          # Resumable: verdicts land in catalog/snapshots/audit/results.json (committed
          # below) and merge.py applies them on the next build, so a budget that runs
          # out simply continues next time. An --offline rebuild here would drop the
          # live-only sources, so the fold-in deliberately waits for the next sync.
          python3 tools/catalog/audit.py --budget-seconds "$AUDIT_BUDGET" --quiet

      - name: Validate
        run: python3 tools/catalog/build_catalog.py --validate

      - name: Summary
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'tools/catalog')
          from schema import expand_catalog   # the file is compact: empty members are left out
          rev = json.load(open('catalog/revision.json', encoding='utf-8'))
          rep = json.load(open('catalog/report.json', encoding='utf-8'))
          games = expand_catalog(json.load(open('catalog/xeno-catalog.json', encoding='utf-8')))['games']
          count = lambda p: sum(1 for g in games if g.get('platform') == p)
          lines = ["revision %s · %s games · %s releases · %s verified · audited %s" % (
              rev.get('revision'), rev.get('games'), rev.get('releases'), rev.get('verifiedReleases'), rev.get('auditedAt') or 'never'),
              "PS5 games: %d · PS4 games: %d · homebrew: %d" % (count('PS5'), count('PS4'), count('HOMEBREW'))]
          try:
              rows = json.load(open('catalog/snapshots/xeno-dlpsgame/catalog.json', encoding='utf-8'))
              if isinstance(rows, list):
                  plat = lambda p: sum(1 for r in rows if isinstance(r, dict) and r.get('platform') == p)
                  lines.append("dlpsgame snapshot: %d posts (%d PS5, %d PS4)" % (len(rows), plat('PS5'), plat('PS4')))
          except (OSError, ValueError):
              pass
          for info in rep.get('sources') or []:
              lines.append("  %-14s %-9s %6s games  %6s releases" % (info.get('id', '?'), info.get('status', '?'), info.get('games', ''), info.get('releases', '')))
          print("\n".join(lines))
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
                  fh.write("### Catalog sync\n\n```\n%s\n```\n" % "\n".join(lines))
          PY

      - name: Commit catalog changes
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xeno-store-catalog-sync"
          git config user.email "xeno-store-catalog-sync@users.noreply.github.com"
          git add catalog/xeno-catalog.json catalog/revision.json catalog/report.json
          git add -A catalog/snapshots/audit catalog/snapshots/enrich catalog/snapshots/xeno-dlpsgame
          if git diff --cached --quiet; then
            echo "catalog unchanged — nothing to commit"
            exit 0
          fi
          REV="$(python3 -c "import json; print(json.load(open('catalog/revision.json'))['revision'])")"
          git commit -m "catalog: sync (revision ${REV}) [catalog-sync]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            echo "push attempt $attempt failed — retrying"
            sleep 10
          done
          echo "::error::could not push the catalog sync"
          exit 1
